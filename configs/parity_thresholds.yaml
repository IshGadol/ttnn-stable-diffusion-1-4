# Parity tolerance policy for SD1.4 TTNN bring-up
#
# Regimes:
# - stub: for placeholder implementations that return zeros or rough approximations
# - early_ttnn: for first functional TTNN bring-up (math mostly correct, minor diffs)
# - final: acceptance-level thresholds (tightened)
#
# Metrics:
# - max_abs: max(|a-b|)
# - mean_abs: mean(|a-b|)
# - rmse: sqrt(mean((a-b)^2))
# - rel_l2: ||a-b||2 / (||a||2 + eps)
#
# Note: UNet noise_pred is float32 and typically centered near 0 with moderate variance.
# Tight final thresholds may be adjusted once TTNN numeric behavior is observed.

regimes:
  stub:
    max_abs: 10.0
    mean_abs: 1.0
    rmse: 2.0
    rel_l2: 1.0

  early_ttnn:
    max_abs: 0.25
    mean_abs: 0.01
    rmse: 0.02
    rel_l2: 0.02

  final:
    max_abs: 0.05
    mean_abs: 0.002
    rmse: 0.005
    rel_l2: 0.005

eps:
  rel_l2: 1.0e-12
